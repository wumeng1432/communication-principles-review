<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通信原理 · 期末复习站 | 中南民族大学 电子信息工程学院</title>
<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --text:#1c2430;
  --text-2:#4a5568;
  --muted:#7b8794;
  --border:#e4e9f2;
  --border-strong:#d3dbe8;
  --primary:#2563eb;
  --primary-d:#1d4ed8;
  --primary-soft:#eaf1fe;
  --cyan:#0891b2;
  --cyan-soft:#e6f7fb;
  --amber:#d97706;
  --amber-soft:#fef4e6;
  --green:#15803d;
  --green-soft:#e8f7ee;
  --red:#dc2626;
  --red-soft:#fdecec;
  --purple:#7c3aed;
  --purple-soft:#f1ecfe;
  --shadow:0 1px 2px rgba(16,32,64,.04), 0 8px 24px rgba(16,32,64,.06);
  --shadow-sm:0 1px 2px rgba(16,32,64,.05);
  --mono:"Cascadia Code","JetBrains Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;
  font-size:15px;
}
a{color:var(--primary);text-decoration:none}
::selection{background:#cfe0ff}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:266px;flex:0 0 266px;background:var(--panel);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 40px;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:8px}
.brand{padding:6px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(135deg,#2563eb,#0891b2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  box-shadow:0 4px 12px rgba(37,99,235,.28);
}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.nav-group{margin-bottom:6px}
.nav-label{
  font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.1px;
  text-transform:uppercase;padding:12px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7.5px 10px;border-radius:8px;
  color:var(--text-2);font-size:13.5px;cursor:pointer;transition:.15s;font-weight:500;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-d);font-weight:700;border-color:#d6e4fd}
.nav-item .idx{
  font-size:11px;font-weight:700;color:var(--muted);width:22px;flex:0 0 22px;text-align:center;
  font-family:var(--mono);
}
.nav-item.active .idx{color:var(--primary)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong);flex:0 0 6px}
.nav-item.active .dot{background:var(--primary)}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:var(--mono)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 30px;display:flex;align-items:center;gap:14px;
}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:700}
.topbar .spacer{flex:1}
.progress-pill{
  display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:999px;padding:5px 13px 5px 11px;font-size:12.5px;color:var(--text-2);
}
.progress-pill .bar{width:78px;height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0891b2);border-radius:99px;transition:width .4s}
.progress-pill b{font-family:var(--mono);color:var(--primary-d)}
.burger{display:none;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px}
.content{padding:30px 34px 90px;max-width:1080px;width:100%;margin:0 auto}

/* ---------- Common ---------- */
.h-title{font-size:27px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.h-sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.section{margin-bottom:26px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;
  box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.card h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.card h3 .ic{
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex:0 0 26px;background:var(--primary-soft);color:var(--primary-d);
}
.card.amber h3 .ic{background:var(--amber-soft);color:var(--amber)}
.card.green h3 .ic{background:var(--green-soft);color:var(--green)}
.card.red h3 .ic{background:var(--red-soft);color:var(--red)}
.card.purple h3 .ic{background:var(--purple-soft);color:var(--purple)}
.card.cyan h3 .ic{background:var(--cyan-soft);color:var(--cyan)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

ul.clean{list-style:none}
ul.clean li{position:relative;padding-left:20px;margin-bottom:9px;color:var(--text-2);font-size:14px}
ul.clean li::before{
  content:"";position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:2px;
  background:var(--primary);opacity:.65;
}
ul.clean li b{color:var(--text)}
ul.check li::before{content:"✓";background:none;color:var(--green);font-weight:800;left:2px;top:0;width:auto;height:auto;font-size:13px}

.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--text-2);
  border:1px solid var(--border);
}
.tag.b{background:var(--primary-soft);color:var(--primary-d);border-color:#d6e4fd}
.tag.a{background:var(--amber-soft);color:var(--amber);border-color:#fbe4c4}
.tag.g{background:var(--green-soft);color:var(--green);border-color:#cdead9}
.tag.r{background:var(--red-soft);color:var(--red);border-color:#f8d7d7}
.tag.p{background:var(--purple-soft);color:var(--purple);border-color:#e3d8fd}
.stars{color:#f0b429;letter-spacing:1px;font-size:13px}
.stars .off{color:#dde3ec}

.formula{
  background:linear-gradient(180deg,#f7faff,#f1f6ff);border:1px solid #dbe7fd;border-left:3px solid var(--primary);
  border-radius:9px;padding:11px 14px;margin-bottom:10px;
}
.formula .fn{font-size:12px;font-weight:700;color:var(--primary-d);margin-bottom:3px}
.formula .fe{font-family:var(--mono);font-size:14.5px;color:#0f2a55;font-weight:600;word-break:break-word}
.formula .fd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55}

.kv{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.kv .kt{background:var(--panel-2);padding:8px 14px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--border)}
.kv .kd{padding:10px 14px;font-size:13.5px;color:var(--text-2);line-height:1.65}

details.ex{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
details.ex summary{
  padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:9px;background:var(--panel-2);color:var(--text);
}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"展开解析 ▾";margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
details.ex[open] summary::after{content:"收起 ▴"}
details.ex .exbody{padding:14px 16px;font-size:13.5px;color:var(--text-2);line-height:1.75;border-top:1px solid var(--border)}
details.ex .exbody .ans{color:var(--green);font-weight:700}
details.ex .exbody .step{font-family:var(--mono);font-size:13px;color:#0f2a55;background:#f5f9ff;border-radius:6px;padding:8px 11px;margin:8px 0;display:block;white-space:pre-wrap;line-height:1.75}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th,table.tb td{border:1px solid var(--border);padding:9px 12px;text-align:left}
table.tb th{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--text-2)}
table.tb tr:hover td{background:#fbfdff}
table.tb td b{color:var(--primary-d)}

.btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--primary);color:#fff;border:none;
  border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;
  font-family:inherit;
}
.btn:hover{background:var(--primary-d);transform:translateY(-1px)}
.btn.ghost{background:var(--panel);color:var(--text-2);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.sm{padding:6px 12px;font-size:12.5px}

.banner{
  background:linear-gradient(135deg,#1e40af 0%,#2563eb 45%,#0891b2 100%);
  color:#fff;border-radius:18px;padding:28px 30px;position:relative;overflow:hidden;
  box-shadow:0 14px 40px rgba(37,99,235,.22);
}
.banner::after{
  content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.10);
}
.banner::before{
  content:"";position:absolute;right:60px;bottom:-90px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.07);
}
.banner h2{font-size:24px;font-weight:800;letter-spacing:-.3px;position:relative;z-index:1}
.banner p{opacity:.92;font-size:13.5px;margin-top:8px;max-width:660px;position:relative;z-index:1}
.banner .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.banner .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}

.stat{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:16px 17px;box-shadow:var(--shadow-sm)}
.stat .n{font-size:24px;font-weight:800;color:var(--primary-d);font-family:var(--mono);letter-spacing:-.5px}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}

.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.quick{
  display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:.16s;box-shadow:var(--shadow-sm);
}
.quick:hover{border-color:#bcd3fb;transform:translateY(-2px);box-shadow:var(--shadow)}
.quick .qi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px}
.quick .qt{font-size:13.5px;font-weight:700}
.quick .qd{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:1px}

.stepper{display:flex;flex-direction:column;gap:0}
.step-row{display:flex;gap:14px;position:relative;padding-bottom:20px}
.step-row:last-child{padding-bottom:0}
.step-row .sd{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:var(--mono);
  border:1px solid #d6e4fd;z-index:1;
}
.step-row .sb{flex:1;padding-top:2px}
.step-row .sb b{font-size:14.5px}
.step-row .sb p{font-size:13px;color:var(--muted);margin-top:3px}
.step-row:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:-4px;width:1.5px;background:var(--border)}

/* search */
.searchbox{
  display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:11px;padding:9px 14px;box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.searchbox input{border:none;outline:none;font-size:14px;flex:1;font-family:inherit;background:transparent;color:var(--text)}
.searchbox .si{color:var(--muted);font-size:15px}

/* quiz */
.q{border:1px solid var(--border);border-radius:12px;padding:15px 17px;margin-bottom:13px;background:var(--panel)}
.q .qh{font-size:13.5px;font-weight:700;margin-bottom:10px;line-height:1.6}
.q .qh .num{color:var(--primary-d);font-family:var(--mono);margin-right:5px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:13.5px;cursor:pointer;
  transition:.13s;display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);color:var(--text-2);
}
.opt:hover{border-color:#bcd3fb;background:#f5f9ff}
.opt .ok{font-weight:800;font-family:var(--mono);color:var(--muted);flex:0 0 auto}
.opt.correct{background:var(--green-soft);border-color:#a9dcbd;color:#0f5c2e}
.opt.correct .ok{color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:#f3bcbc;color:#8f1d1d}
.opt.wrong .ok{color:var(--red)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--border);background:var(--panel-2)}
.opt.correct.locked:hover{background:var(--green-soft)}
.opt.wrong.locked:hover{background:var(--red-soft)}
.exp{margin-top:10px;font-size:12.5px;color:var(--text-2);background:#f5f9ff;border-left:3px solid var(--primary);border-radius:6px;padding:9px 12px;line-height:1.7;display:none}
.exp.show{display:block}
.exp b{color:var(--primary-d)}

.scorebar{
  display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-sm);position:sticky;top:62px;z-index:10;margin-bottom:18px;
}
.scorebar .big{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--primary-d)}
.scorebar .lbl{font-size:12px;color:var(--muted)}
.scorebar .sep{width:1px;height:34px;background:var(--border)}

.chapter-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.chapter-head .cn{
  width:56px;height:56px;flex:0 0 56px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#0891b2);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:var(--mono);
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}
.chapter-head .ct{flex:1;min-width:200px}
.chapter-head .ct h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.chapter-head .ct .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
.done-toggle{
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-2);
  border:1px solid var(--border-strong);border-radius:9px;padding:7px 13px;cursor:pointer;background:var(--panel);
}
.done-toggle.on{background:var(--green-soft);border-color:#a9dcbd;color:var(--green)}
.done-toggle .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.done-toggle.on .box{background:var(--green);border-color:var(--green)}

.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.chapter-nav a{
  flex:1;border:1px solid var(--border);border-radius:11px;padding:12px 15px;background:var(--panel);
  display:flex;flex-direction:column;gap:2px;transition:.15s;
}
.chapter-nav a:hover{border-color:#bcd3fb;background:#fbfdff}
.chapter-nav a .d{font-size:11px;color:var(--muted)}
.chapter-nav a .t{font-size:13.5px;font-weight:700;color:var(--text)}
.chapter-nav a.next{align-items:flex-end;text-align:right}

.note{
  background:var(--amber-soft);border:1px solid #fbe4c4;border-radius:10px;padding:12px 15px;
  font-size:13px;color:#8a5a08;line-height:1.7;margin-bottom:14px;
}
.note b{color:#7a4d05}
.note.blue{background:var(--primary-soft);border-color:#d6e4fd;color:#1e40af}
.note.blue b{color:#1d4ed8}
.note.gray{background:var(--panel-2);border-color:var(--border);color:var(--text-2)}
.note.gray b{color:var(--text)}

footer{padding:24px 34px 40px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--border);margin-top:20px;line-height:1.9}

@media(max-width:960px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .sidebar.open{transform:none}
  .burger{display:block}
  .content{padding:20px 18px 70px}
  .topbar{padding:9px 16px}
  .h-title{font-size:22px}
  .banner{padding:22px 20px}
  .banner h2{font-size:19px}
  .scorebar{position:static;flex-wrap:wrap;gap:12px}
  .progress-pill{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mark">通</div>
        <div>
          <h1>通信原理 · 期末复习站</h1>
          <p>樊昌信 第7版 · 国防工业出版社</p>
        </div>
      </div>
    </div>
    <div id="nav"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="progress-pill">
        <span>复习进度</span>
        <div class="bar"><i id="pbar" style="width:0%"></i></div>
        <b id="ptxt">0/13</b>
      </div>
    </div>
    <div class="content" id="view"></div>
    <footer>
      本站为课程复习辅助资料，依据樊昌信、曹丽娜《通信原理》（第7版，国防工业出版社）章节体系，
      结合公开试题题型与高频考点整理。<br>
      模拟卷为按教材重点与常见题型编写的练习，非官方原卷，仅供自测。以授课教师要求与教材为准。
    </footer>
  </div>
</div>
<script src="data.js"></script>
<script src="exam.js"></script>
<script src="app.js"></script>
</body>
</html>
